name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# This repository serves Pages from the `gh-pages` branch
# (Settings → Pages → "Deploy from a branch"), so the build is published by
# pushing to that branch. The Actions-artifact deployment path is blocked here by
# the github-pages environment protection rules.
permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build all editions
        run: npm run build

      - name: Publish to gh-pages
        run: |
          # Jekyll would otherwise drop files and folders beginning with an underscore.
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
