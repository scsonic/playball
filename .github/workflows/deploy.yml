name: Build, Deploy and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'main-pipeline'
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- web ------
  web:
    name: Test, build and publish the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build all editions
        run: npm run build

      # This repository serves Pages from the `gh-pages` branch
      # (Settings → Pages → "Deploy from a branch"), so the build is published by
      # pushing to that branch. The Actions-artifact deployment path is blocked here
      # by the github-pages environment protection rules.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          # Jekyll would otherwise drop files and folders beginning with an underscore.
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------ android ------
  android:
    name: Build the kiosk APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Builds the web game, syncs it into the APK assets, then assembles.
      - name: Build APK
        run: npm run android:build

      - name: Name the artifact
        id: apk
        run: |
          NAME="catch-challenge-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-challenge-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      # A rolling "latest" prerelease so the newest kiosk build is always one click
      # away, plus a permanent release for every version tag.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.apk.outputs.name }}" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of \`main\` @ ${GITHUB_SHA::7}.

          - Play in a browser: https://scsonic.github.io/playball/
          - Android kiosk APK (debug-signed, sideload with \`adb install -r\`) attached below.

          The APK bundles both editions of the web game and drives a USB (UVC) camera
          through libuvc. See \`android/README.md\` for setup and troubleshooting." \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.name }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
